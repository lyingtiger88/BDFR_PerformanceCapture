name: core-ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBDFRPC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  opencv-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - name: Configure with live camera backend
        run: cmake -S . -B build-opencv -DBDFRPC_ENABLE_OPENCV=ON -DBDFRPC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-opencv --config Release
      - name: Test core
        run: ctest --test-dir build-opencv -C Release --output-on-failure
